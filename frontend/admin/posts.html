<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Posts — Utsav Showroom Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div class="mu-shell">
  <aside class="mu-sidebar">
    <h1>Utsav Showroom<br>Admin</h1>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="posts.html" class="active">Posts / Products</a>
      <a href="inventory.html">Inventory</a>
      <a href="categories.html">Categories</a>
      <a href="admins.html">Manage Owners</a>
    </nav>
    <div class="mu-logout"><button class="btn" id="logoutBtn" style="width:100%">Log out</button></div>
  </aside>
  <main class="mu-main">
    <div class="mu-topbar">
      <h2>Posts / Products</h2>
      <button class="btn btn-primary" type="button" id="openQuickAddBtn">+ Create New Post</button>
    </div>

    <div class="mu-filters">
      <select id="statusFilter">
        <option value="">All statuses</option>
        <option value="DRAFT">Draft</option>
        <option value="PUBLISHED">Published</option>
        <option value="ARCHIVED">Archived</option>
      </select>
      <input type="text" id="searchBox" placeholder="Search title…">
    </div>

    <div class="mu-card" style="padding:0;">
      <table class="mu-table">
        <thead><tr><th>Title</th><th>Category</th><th>Status</th><th>Price</th><th>Updated</th><th></th></tr></thead>
        <tbody id="postsBody"><tr><td colspan="6" class="mu-empty">Loading…</td></tr></tbody>
      </table>
    </div>
  </main>
</div>
<script src="js/admin-api.js"></script>
<script>
let ALL_POSTS = [];

function statusBadge(s) {
  return `<span class="mu-badge ${s.toLowerCase()}">${s}</span>`;
}

function render() {
  const status = document.getElementById('statusFilter').value;
  const q = document.getElementById('searchBox').value.toLowerCase();
  const rows = ALL_POSTS.filter(p =>
    (!status || p.status === status) &&
    (!q || p.title.toLowerCase().includes(q))
  );
  const body = document.getElementById('postsBody');
  if (!rows.length) { body.innerHTML = '<tr><td colspan="6" class="mu-empty">No posts match.</td></tr>'; return; }
  body.innerHTML = rows.map(p => `
    <tr>
      <td><a href="post-edit.html?id=${p.id}">${p.title}</a></td>
      <td>${p.category ? p.category.label : '—'}</td>
      <td>${statusBadge(p.status)}</td>
      <td>${p.price != null ? '₹' + p.price : '—'}</td>
      <td>${new Date(p.updatedAt).toLocaleDateString()}</td>
      <td class="mu-inline">
        <a class="btn btn-sm" href="post-edit.html?id=${p.id}">Edit</a>
        ${p.status !== 'PUBLISHED' ? `<button class="btn btn-sm" data-act="publish" data-id="${p.id}">Publish</button>` : `<button class="btn btn-sm" data-act="unpublish" data-id="${p.id}">Unpublish</button>`}
        <button class="btn btn-sm btn-danger" data-act="delete" data-id="${p.id}">Delete</button>
      </td>
    </tr>
  `).join('');
}

async function loadPosts() {
  const { posts } = await api('/api/posts?all=1');
  ALL_POSTS = posts;
  render();
}

document.getElementById('statusFilter').addEventListener('change', render);
document.getElementById('searchBox').addEventListener('input', render);

document.getElementById('postsBody').addEventListener('click', async (e) => {
  const btn = e.target.closest('button[data-act]');
  if (!btn) return;
  const { act, id } = btn.dataset;
  try {
    if (act === 'publish') await api(`/api/posts/${id}/status`, { method: 'PATCH', body: { status: 'PUBLISHED' } });
    if (act === 'unpublish') await api(`/api/posts/${id}/status`, { method: 'PATCH', body: { status: 'DRAFT' } });
    if (act === 'delete') {
      if (!confirm('Delete this post permanently? This cannot be undone. (Consider "Archive" via status instead.)')) return;
      await api(`/api/posts/${id}`, { method: 'DELETE' });
    }
    toast('Done.');
    await loadPosts();
  } catch (err) { toast(err.message, true); }
});

(async function () {
  await requireAdminSession();
  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await api('/api/auth/logout', { method: 'POST' });
    window.location.href = 'index.html';
  });
  try { await loadPosts(); } catch (e) { toast(e.message, true); }
})();
</script>
<!-- Floating "Quick Add" window — create a new item without leaving this page.
     Fill the basics + drop in a photo here; click "Save & Add Details" to
     jump into the full editor for sections/features/gallery if needed. -->
<div class="mu-modal-overlay" id="quickAddOverlay" style="display:none;">
  <div class="mu-modal">
    <div class="mu-modal-head">
      <h3>Add New Item</h3>
      <button class="btn btn-sm" type="button" id="closeQuickAddBtn">✕</button>
    </div>
    <div class="mu-modal-body">
      <div class="mu-form-row">
        <label>Title</label>
        <input type="text" id="qa_title" placeholder="e.g. Radiant Bridal Lehenga">
      </div>
      <div class="mu-form-grid">
        <div class="mu-form-row">
          <label>Category</label>
          <select id="qa_category"><option value="">— none —</option></select>
        </div>
        <div class="mu-form-row">
          <label>Price (₹)</label>
          <input type="number" id="qa_price" placeholder="e.g. 4500">
        </div>
      </div>
      <div class="mu-form-row">
        <label>Short description</label>
        <textarea id="qa_desc" placeholder="A line or two shoppers will see on the card"></textarea>
      </div>
      <div class="mu-form-row">
        <label>Photo</label>
        <div id="qa_dropzone" class="mu-dropzone mu-dropzone-wide">
          <div class="mu-dropzone-icon">⬆</div>
          <div class="mu-dropzone-text" id="qa_dropzone_text">Drag an image here, or click to browse</div>
          <input type="file" id="qa_file" accept=".jpg,.jpeg,.png,.webp" style="display:none">
        </div>
        <img id="qa_preview" style="display:none;max-width:140px;max-height:140px;border-radius:6px;margin-top:10px;object-fit:cover;">
      </div>
    </div>
    <div class="mu-modal-foot">
      <button class="btn" type="button" id="qa_cancel">Cancel</button>
      <button class="btn btn-primary" type="button" id="qa_save">Save Item</button>
    </div>
  </div>
</div>

<script>
(function () {
  let qaSelectedFile = null;

  async function openQuickAdd() {
    document.getElementById('quickAddOverlay').style.display = 'flex';
    const catSel = document.getElementById('qa_category');
    if (!catSel.dataset.loaded) {
      try {
        const { categories } = await api('/api/categories');
        categories.forEach(c => { const o = document.createElement('option'); o.value = c.id; o.textContent = c.label; catSel.appendChild(o); });
        catSel.dataset.loaded = '1';
      } catch (e) { /* category list is optional for quick add */ }
    }
  }
  function closeQuickAdd() {
    document.getElementById('quickAddOverlay').style.display = 'none';
    ['qa_title', 'qa_price', 'qa_desc'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('qa_category').value = '';
    qaSelectedFile = null;
    document.getElementById('qa_preview').style.display = 'none';
    document.getElementById('qa_dropzone_text').textContent = 'Drag an image here, or click to browse';
  }

  document.getElementById('openQuickAddBtn').addEventListener('click', openQuickAdd);
  document.getElementById('closeQuickAddBtn').addEventListener('click', closeQuickAdd);
  document.getElementById('qa_cancel').addEventListener('click', closeQuickAdd);
  document.getElementById('quickAddOverlay').addEventListener('click', (e) => { if (e.target.id === 'quickAddOverlay') closeQuickAdd(); });

  function handleQaFile(file) {
    if (!file) return;
    qaSelectedFile = file;
    document.getElementById('qa_dropzone_text').textContent = file.name;
    const preview = document.getElementById('qa_preview');
    preview.src = URL.createObjectURL(file);
    preview.style.display = 'block';
  }
  const qaZone = document.getElementById('qa_dropzone');
  const qaInput = document.getElementById('qa_file');
  qaZone.addEventListener('click', () => qaInput.click());
  qaInput.addEventListener('change', () => handleQaFile(qaInput.files[0]));
  ['dragenter', 'dragover'].forEach(evt => qaZone.addEventListener(evt, (e) => { e.preventDefault(); qaZone.classList.add('dragover'); }));
  ['dragleave', 'drop'].forEach(evt => qaZone.addEventListener(evt, (e) => { e.preventDefault(); qaZone.classList.remove('dragover'); }));
  qaZone.addEventListener('drop', (e) => { const f = e.dataTransfer.files[0]; if (f) handleQaFile(f); });

  document.getElementById('qa_save').addEventListener('click', async () => {
    const title = document.getElementById('qa_title').value.trim();
    if (!title) { toast('Give the item a title first.', true); return; }
    const slug = title.toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '') + '-' + Date.now().toString(36);
    const body = {
      title, slug,
      categoryId: document.getElementById('qa_category').value || null,
      price: document.getElementById('qa_price').value === '' ? null : Number(document.getElementById('qa_price').value),
      shortDescription: document.getElementById('qa_desc').value || null,
      status: 'DRAFT',
    };
    try {
      const { post } = await api('/api/posts', { method: 'POST', body });
      if (qaSelectedFile) {
        const fd = new FormData();
        fd.append('image', qaSelectedFile);
        fd.append('postId', post.id);
        fd.append('setCover', '1');
        await apiUpload('/api/images/upload', fd);
      }
      toast('Item created as a draft.');
      closeQuickAdd();
      window.location.href = `post-edit.html?id=${post.id}`;
    } catch (e) { toast(e.message, true); }
  });
})();
</script>
</body>
</html>
